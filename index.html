<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart IoT Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin: 15px auto;
      width: 300px;
      border-radius: 10px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .on {
      background: green;
      color: white;
    }

    .off {
      background: red;
      color: white;
    }
  </style>
</head>

<body>

  <h1>Smart IoT Dashboard</h1>

  <div class="card">
    <h2>Temperature</h2>
    <h3 id="temp">-- °C</h3>
  </div>

  <div class="card">
    <h2>Humidity</h2>
    <h3 id="hum">-- %</h3>
  </div>

  <div class="card">
    <h2>Light Control</h2>
    <button class="on">ON</button>
    <button class="off">OFF</button>
  </div>

</body>
</html>
